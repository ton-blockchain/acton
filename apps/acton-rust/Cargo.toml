[workspace]
members = ["compiler", "examples/counter", "lang", "lang-macros"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["TON Core"]
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/ton-blockchain/acton"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
acton-lang = { path = "lang" }
acton-lang-macros = { path = "lang-macros" }
expect-test = "1.5.0"
syn = { version = "2.0.114", features = ["full", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
