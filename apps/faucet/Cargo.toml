[package]
name = "faucet"
version = { workspace = true }
publish = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
publish = false
authors = ["TON Core"]
edition = "2024"
rust-version = "1.96.1"
repository = "https://github.com/ton-blockchain/acton"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4", features = ["serde"] }
faucet-config = { path = "crates/faucet-config" }
hex = "0.4.3"
http = "1"
ipnet = "2"
rand = "0.9.2"
reqwest = "0.12.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
sha2 = "0.10.9"
tokio = "1.48.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

[dependencies]
anyhow = { workspace = true }
apalis = "1.0.0-beta.2"
apalis-sqlite = "1.0.0-beta.4"
axum = { version = "0.8.8", features = ["macros"] }
axum-governor = "1"
base64 = "0.22.1"
chrono = { workspace = true }
dotenvy = "0.15.7"
faucet-antifraud = { path = "crates/faucet-antifraud" }
faucet-config = { workspace = true }
faucet-pow = { path = "crates/faucet-pow" }
faucet-valkey = { path = "crates/faucet-valkey" }
hex = { workspace = true }
lazy-limit = "1"
rand = { workspace = true }
real = { version = "0.1", features = ["axum"] }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
ton = "0.1.4"
toncenter = { path = "crates/toncenter" }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { version = "5.5", features = ["axum_extras", "macros"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[build-dependencies]
chrono = { workspace = true }

[profile.dev.package.sqlx-macros]
opt-level = 3

[lints.clippy]
collapsible_if = "allow"

[lib]
doctest = false
