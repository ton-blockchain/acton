[package]
name = "faucet"
description = "TON testnet faucet backend"
version = { workspace = true }
default-run = "faucet"
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[[bin]]
name = "faucet-cli"
path = "faucet-cli/main.rs"

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["TON Core"]
edition = "2024"
rust-version = "1.98.1"
repository = "https://github.com/ton-blockchain/acton"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
faucet-config = { path = "crates/faucet-config" }
hex = "0.4.3"
http = "1"
ipnet = "2"
rand = "0.9.2"
reqwest = "0.12.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
sha2 = "0.10.9"
time = "0.3"
tokio = "1.53.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

[dependencies]
anyhow = { workspace = true }
apalis = "1.2"
apalis-sqlite = "1.2"
axum = { workspace = true, features = ["macros"] }
axum-governor = "1"
base64 = "0.22.1"
dotenvy = "0.15.7"
dunce = "1.0.5"
faucet-antifraud = { path = "crates/faucet-antifraud" }
faucet-config = { workspace = true }
faucet-pow = { path = "crates/faucet-pow" }
faucet-valkey = { path = "crates/faucet-valkey" }
hex = { workspace = true }
include_dir = "0.7"
lazy-limit = "1"
rand = { workspace = true }
real = { version = "0.1", features = ["axum"] }
reqwest = { workspace = true, features = ["json"] }
semver = "1.0.28"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite"] }
time = { workspace = true, features = ["serde-well-known"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
rston = { path = "../../libs/rston", default-features = false, features = ["wallet"] }
toncenter = { path = "crates/toncenter" }
tower = "0.5"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { version = "5.5", features = ["axum_extras", "macros"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[build-dependencies]
time = { workspace = true }

[profile.dev.package.sqlx-macros]
opt-level = 3

[lints.clippy]
collapsible_if = "allow"

[lib]
doctest = false
