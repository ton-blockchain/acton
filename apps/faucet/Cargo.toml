[package]
name = "faucet-backend"
version = { workspace = true }
publish = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
publish = false
authors = ["TON Core"]
edition = "2024"
rust-version = "1.94.1"
repository = "https://github.com/ton-blockchain/faucet"

[workspace.dependencies]
anyhow = "1.0.100"
faucet-config = { path = "crates/config" }
hex = "0.4.3"
rand = "0.9.2"
reqwest = "0.12.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
sha2 = "0.10.9"
tokio = "1.48.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
axum-governor = "1"
lazy-limit = "1"
tower = "0.5"
real = { version = "0.1", features = ["axum"] }
apalis = { version = "1.0.0-beta.2" }
apalis-sqlite = "1.0.0-beta.4"
anyhow = { workspace = true }
faucet-antifraud = { path = "crates/antifraud" }
faucet-config = { workspace = true }
faucet-pow = { path = "crates/pow" }
faucet-valkey = { path = "crates/valkey" }
dotenvy = "0.15.7"
ton = "0.1.4"
toncenter = { path = "crates/toncenter" }
moka = { version = "0.12.12", features = ["sync"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[build-dependencies]
chrono = { version = "0.4", features = ["serde"] }

[profile.dev.package.sqlx-macros]
opt-level = 3

[lints.clippy]
collapsible_if = "allow"

[lib]
doctest = false
