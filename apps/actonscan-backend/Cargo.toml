[package]
name = "actonscan-backend"
description = "Actonscan network statistics backend"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
ton-indexer-core = { path = "../../crates/ton-indexer-core" }
ton-indexer-liteserver = { path = "../../crates/ton-indexer-liteserver" }
tower-http = { workspace = true, features = ["compression-br", "compression-gzip", "cors"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml.workspace = true
tycho-types.workspace = true
utoipa = { version = "5.5", features = ["axum_extras", "macros"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

[lib]
doctest = false
