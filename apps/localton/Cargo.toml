[package]
name = "localton"
description = "A complete headless local TON development network"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[package.metadata.cargo-shear]
# cargo-shear 1.13.4 does not normalize the `..` segments in test module #[path] attributes.
# https://github.com/Boshen/cargo-shear/issues/587
ignored-paths = [
    "tests/binaries/github.rs",
    "tests/bootstrap/genesis_render.rs",
    "tests/bootstrap/genesis_settings.rs",
]

[workspace]
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
authors = ["TON Core"]
edition = "2024"
rust-version = "1.98.1"
repository = "https://github.com/ton-blockchain/acton"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.89"
expect-test = "1.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tokio = "1.47"
tracing = "0.1"

[dependencies]
toncenter = { path = "../../crates/toncenter" }
localton-genesis = { path = "../../crates/localton-genesis" }
ton-hardfork = { path = "../../crates/ton-hardfork" }
anyhow = "1.0"
async-trait.workspace = true
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
crc = "3.3"
dunce = "1.0.5"
ed25519-dalek = "2.2"
flate2 = "1.1.5"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
include_dir = "0.7"
indicatif = "0.18.3"
localton-indexer = { path = "crates/indexer" }
maxminddb = "0.30.3"
nix = { version = "0.30", features = ["process", "signal"] }
num-bigint = "0.4"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile.workspace = true
tar = "0.4.46"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
ton-fullnode-master = { path = "../../crates/ton-fullnode-master" }
tower-http = { version = "0.6", features = ["fs"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rston = { path = "../../libs/rston", default-features = false, features = ["models", "wallet", "liteclient"] }
utoipa = { version = "5.5", features = ["axum_extras", "macros"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
expect-test.workspace = true

[build-dependencies]
chrono = "0.4"

[profile.release]
strip = true
lto = "thin"
