[package]
name = "localton-indexer"
description = "Embedded network metrics indexer for Localton"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
rusqlite = { version = "0.31", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0"
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
ton-indexer-core = { path = "../../../../crates/ton-indexer-core" }
ton-indexer-liteserver = { path = "../../../../crates/ton-indexer-liteserver" }
tracing.workspace = true

[dev-dependencies]
expect-test.workspace = true
tempfile.workspace = true

[lib]
doctest = false
