[package]
name = "Acton"
description = "All-in-one toolkit for TON Blockchain smartcontract development"
version = "1.1.0"
license = "MIT"

[test]
include = ["tests/acton-stdlib/**"]
fail-on-diff = false

[test.mutation]

[lint]
# The Localton load test has its own imports; check-ci lints it separately.
exclude = ["tests/**", "**/templates/**", "packages/test-ui/e2e/**", "crates/ton-language-server-core/tests/fixtures/**", "crates/ton-language-server-core/tests/languages/tolk/compiler/fixtures/**", "apps/localton/load-test/**"]

[fmt]
ignore = ["crates/tolk-compiler/**", "crates/ton-language-server-core/tests/languages/tolk/compiler/fixtures/**", "tests/integration/snapshots/check/**"]

[localnet]
port = 3010
accounts = []

[networks.localnet]
api = { v2 = "http://localhost:3010/api/v2", v3 = "http://localhost:3010/api/v3" }

[import-mappings]
acton = ".acton"
local-acton = "lib"
