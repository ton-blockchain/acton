[package]
name = "ton-language-server-core"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[features]
default = ["all-languages"]
all-languages = ["tlb", "tasm", "fift", "tolk"]
tlb = ["dep:tlb-syntax", "dep:ton-syntax"]
tasm = ["dep:tasm-syntax"]
fift = ["dep:fift-syntax"]
tolk = [
    "dep:include_dir",
    "dep:tolk-analysis",
    "dep:tolk-resolver",
    "dep:tolk-syntax",
    "dep:tolk-ty",
    "dep:toml",
]

[dependencies]
anyhow = { workspace = true }
include_dir = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
fift-syntax = { workspace = true, optional = true }
tasm-syntax = { workspace = true, optional = true }
tlb-syntax = { workspace = true, optional = true }
tolk-resolver = { workspace = true, optional = true }
tolk-analysis = { workspace = true, optional = true }
tolk-syntax = { workspace = true, optional = true }
tolk-ty = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
ton-syntax = { workspace = true, optional = true }
tracing = { workspace = true }
tree-sitter = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
expect-test = { workspace = true }

[[test]]
name = "logging"
path = "tests/logging.rs"
required-features = ["tlb"]

[[test]]
name = "profiling"
path = "tests/profiling.rs"
required-features = ["tlb", "tolk"]

[[test]]
name = "tlb_definition"
path = "tests/languages/tlb/definition.rs"
required-features = ["tlb"]

[[test]]
name = "tlb_completion"
path = "tests/languages/tlb/completion.rs"
required-features = ["tlb"]

[[test]]
name = "tlb_incremental_edit"
path = "tests/languages/tlb/incremental_edit.rs"
required-features = ["tlb"]

[[test]]
name = "tlb_semantic_tokens"
path = "tests/languages/tlb/semantic_tokens.rs"
required-features = ["tlb"]

[[test]]
name = "tasm_hover"
path = "tests/languages/tasm/hover.rs"
required-features = ["tasm"]

[[test]]
name = "tasm_completion"
path = "tests/languages/tasm/completion.rs"
required-features = ["tasm"]

[[test]]
name = "tasm_code_lens"
path = "tests/languages/tasm/code_lens.rs"
