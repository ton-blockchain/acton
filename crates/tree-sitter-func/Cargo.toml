[package]
name = "tree-sitter-func"
description = "FunC grammar generated with Tree-sitter"
version = "0.1.0"
authors = [
  "TON Core",
  "akifoq"
]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "func"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/ton-blockchain/acton"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language.workspace = true

[build-dependencies]
cc.workspace = true

[dev-dependencies]
tree-sitter.workspace = true

[lints.clippy]
const_is_empty = "allow"
