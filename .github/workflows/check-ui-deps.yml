name: Check UI Dependencies

on:
  workflow_call:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/check-ui-deps.yml"
      - ".npmrc"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "crates/**-ui/package.json"
      - "crates/acton-**-ui/package.json"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-ui-deps.yml"
      - ".npmrc"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "crates/**-ui/package.json"
      - "crates/acton-**-ui/package.json"
  workflow_dispatch:

concurrency:
  group: check-ui-deps-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  bun-audit:
    name: Bun audit
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installing additional Rust components
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: just@1.58.0
          fallback: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Run Bun audit
        run: just check-ui-security
