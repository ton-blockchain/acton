name: Check localton

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/check-localton.yml"
      - "libs/rston/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/localton/**"
      - "crates/ton-fullnode-master/**"
      - "crates/ton-hardfork/**"
      - "crates/ton-indexer-core/**"
      - "crates/ton-indexer-liteserver/**"
      - "crates/ton-liteapi/**"
      - "crates/toncenter/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-localton.yml"
      - "libs/rston/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/localton/**"
      - "crates/ton-fullnode-master/**"
      - "crates/ton-hardfork/**"
      - "crates/ton-indexer-core/**"
      - "crates/ton-indexer-liteserver/**"
      - "crates/ton-liteapi/**"
      - "crates/toncenter/**"
  workflow_dispatch:

concurrency:
  group: check-localton-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  build:
    name: Build localton
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/localton

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: apps-localton-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: apps/localton -> target

      - name: Install Rust
        run: rustup toolchain install

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install UI dependencies
        working-directory: ${{ github.workspace }}
        run: bun ci

      - name: Install just
        uses: taiki-e/install-action@v2.87.7
        with:
          tool: just@1.58.0
          fallback: none

      - name: Build localton
        run: just build-ci

  check:
    name: Check localton
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/localton

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: apps-localton-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: apps/localton -> target

      - name: Install Rust
        run: rustup toolchain install

      - name: Install check tools
        uses: taiki-e/install-action@v2.87.7
        with:
          tool: just@1.58.0,cargo-shear@1.13.4,cargo-deny@0.20.2
          fallback: none

      - name: Test localton
        run: just test

      - name: Check localton
        run: just check-ci
