name: Build Acton VS Code Extension

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/build-acton-ls-vscode.yml"
      - "crates/ton-language-server-native/editors/code/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-acton-ls-vscode.yml"
      - "crates/ton-language-server-native/editors/code/**"
  workflow_dispatch:

concurrency:
  group: build-vscode-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  build:
    name: Build VS Code Extension
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    steps:
      - name: Fetch Sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Audit dependencies
        working-directory: crates/ton-language-server-native/editors/code
        run: bun audit --audit-level=moderate

      - name: Install dependencies
        working-directory: crates/ton-language-server-native/editors/code
        run: bun install --frozen-lockfile

      - name: Build extension
        working-directory: crates/ton-language-server-native/editors/code
        run: bun run build
