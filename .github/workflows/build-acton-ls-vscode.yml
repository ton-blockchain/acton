name: Build Acton VS Code Extension

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/build-acton-ls-vscode.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/bin/acton.rs"
      - "src/commands/ls/**"
      - "crates/ton-language-server-core/**"
      - "crates/ton-language-server-native/Cargo.toml"
      - "crates/ton-language-server-native/src/**"
      - "crates/ton-language-server-native/editors/code/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-acton-ls-vscode.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/bin/acton.rs"
      - "src/commands/ls/**"
      - "crates/ton-language-server-core/**"
      - "crates/ton-language-server-native/Cargo.toml"
      - "crates/ton-language-server-native/src/**"
      - "crates/ton-language-server-native/editors/code/**"
  workflow_dispatch:

concurrency:
  group: build-vscode-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  build:
    name: Build VS Code Extension
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    steps:
      - name: Fetch Sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Rust
        run: rustup toolchain install

      - name: Install dependencies
        working-directory: crates/ton-language-server-native/editors/code
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        working-directory: crates/ton-language-server-native/editors/code
        run: bun audit --audit-level=moderate

      - name: Check formatting and linting
        working-directory: crates/ton-language-server-native/editors/code
        run: bun run check

      - name: Check types
        working-directory: crates/ton-language-server-native/editors/code
        run: bun run typecheck

      - name: Run tests
        working-directory: crates/ton-language-server-native/editors/code
        run: bun run test

      - name: Build Acton language server
        run: cargo build --bin acton

      - name: Run Extension Host smoke tests
        working-directory: crates/ton-language-server-native/editors/code
        run: xvfb-run -a bun run test:e2e

      - name: Build extension
        working-directory: crates/ton-language-server-native/editors/code
        run: bun run build

      - name: Build VSIX
        working-directory: crates/ton-language-server-native/editors/code
        run: bunx vsce package --no-dependencies --out acton-language-server.vsix

