name: Update ABI Catalog

on:
  schedule:
    # 00:00 Europe/Moscow (21:00 UTC)
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: update-abi-catalog
  cancel-in-progress: false

permissions: { }

env:
  UPSTREAM_REPOSITORY: ton-blockchain/abis

jobs:
  update:
    name: Update bundled ABI catalog
    if: github.repository == 'ton-blockchain/acton'
    runs-on: ubicloud-standard-2-ubuntu-2204
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download latest ABI catalog release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        # language=Bash
        run: |
          release_tag=$(gh release view \
            --repo "${UPSTREAM_REPOSITORY}" \
            --json tagName \
            --jq '.tagName')
          echo "Found release tag: ${release_tag}"

          release_dir="${RUNNER_TEMP}/abi-catalog-release"
          mkdir --parents "${release_dir}"

          gh release download "${release_tag}" \
            --repo "${UPSTREAM_REPOSITORY}" \
            --pattern 'abi-catalog.json' \
            --pattern 'abi-catalog.json.sha256' \
            --dir "${release_dir}"

          (cd "${release_dir}" && sha256sum --check abi-catalog.json.sha256)

          cp \
            "${release_dir}/abi-catalog.json" \
            crates/acton-abi-catalog/data/data-abis.json
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Check for changes
        id: changes
        # language=Bash
        run: |
          if git diff --quiet -- crates/acton-abi-catalog/data/data-abis.json; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-abi-catalog
          UPSTREAM_RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
        # language=Bash
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create "${UPDATE_BRANCH}"
          git add crates/acton-abi-catalog/data/data-abis.json
          git commit --message "chore(abi-catalog): update ABI catalog"

          remote_sha=$(git ls-remote --heads origin "${UPDATE_BRANCH}" | awk '{print $1}')
          if [[ -n "${remote_sha}" ]]; then
            git push origin "HEAD:refs/heads/${UPDATE_BRANCH}" \
              --force-with-lease="refs/heads/${UPDATE_BRANCH}:${remote_sha}"
          else
            git push --set-upstream origin "${UPDATE_BRANCH}"
          fi

          body_file="${RUNNER_TEMP}/abi-catalog-pr.md"
          cat > "${body_file}" <<EOF
          Updates the bundled ABI catalog from [${UPSTREAM_REPOSITORY} ${UPSTREAM_RELEASE_TAG}](https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${UPSTREAM_RELEASE_TAG}).

          The upstream SHA-256 checksum was verified in the [update workflow](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) before the file was copied.
          EOF

          pull_request=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${UPDATE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [[ -z "${pull_request}" ]]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base master \
              --head "${UPDATE_BRANCH}" \
              --title "chore(abi-catalog): update ABI catalog" \
              --body-file "${body_file}"
          else
            gh pr edit "${pull_request}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "chore(abi-catalog): update ABI catalog" \
              --body-file "${body_file}"
          fi
