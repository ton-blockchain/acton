name: Check verifier

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/check-verifier.yml"
      - "apps/verifier/**"
      - "libs/rston/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-verifier.yml"
      - "apps/verifier/**"
      - "libs/rston/**"
  workflow_dispatch:

concurrency:
  group: check-verifier-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  build:
    name: Build verifier
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/verifier

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: apps-verifier-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: apps/verifier -> target

      - name: Install Rust
        run: rustup toolchain install

      - name: Install just
        uses: taiki-e/install-action@v2.87.7
        with:
          tool: just@1.58.0
          fallback: none

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Build verifier
        run: just build-ci

  check:
    name: Check verifier
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/verifier

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: apps-verifier-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: apps/verifier -> target

      - name: Install Rust
        run: rustup toolchain install

      - name: Install check tools
        uses: taiki-e/install-action@v2.87.7
        with:
          tool: just@1.58.0,cargo-shear@1.13.4,cargo-deny@0.20.2
          fallback: none

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: npm
          cache-dependency-path: apps/verifier/compiler-worker/package-lock.json
          node-version: 22

      - name: Test verifier
        run: just test

      - name: Check verifier
        run: just check-ci
