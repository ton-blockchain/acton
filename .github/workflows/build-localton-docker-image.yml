name: Build localton Docker image

on:
  workflow_dispatch:

permissions: { }

concurrency:
  group: build-localton-docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubicloud-standard-30
          - arch: arm64
            platform: linux/arm64
            runner: ubicloud-standard-30-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          cache-binary: false

      - name: Prepare compiler cache directories
        run: |
          mkdir -p \
            localton-cache-mount \
            localton-cargo-registry-cache \
            localton-cargo-target-cache \
            localton-ton-indexer-ccache \
            localton-ton-indexer-go-build \
            localton-ton-indexer-go-mod \
            localton-ton-indexer-pip

      - name: Restore TON HTTP API compiler cache
        id: http-api-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: localton-cache-mount
          key: localton-ton-http-api-ccache-v1-${{ matrix.arch }}-${{ hashFiles('apps/localton/Dockerfile', 'apps/localton/Cargo.lock', 'apps/localton/xtask/Cargo.toml', 'apps/localton/xtask/src/**/*.rs') }}
          restore-keys: |
            localton-ton-http-api-ccache-v1-${{ matrix.arch }}-

      - name: Restore Rust compiler cache
        id: rust-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            localton-cargo-registry-cache
            localton-cargo-target-cache
          key: localton-rust-build-cache-v1-${{ matrix.arch }}-${{ hashFiles('apps/localton/Cargo.toml', 'apps/localton/Cargo.lock', 'apps/localton/src/**/*.rs', 'apps/localton/xtask/Cargo.toml', 'apps/localton/xtask/src/**/*.rs', 'apps/localton/docker/ton-indexer-*.patch') }}
          restore-keys: |
            localton-rust-build-cache-v1-${{ matrix.arch }}-

      - name: Restore TON Indexer compiler caches
        id: ton-indexer-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            localton-ton-indexer-ccache
            localton-ton-indexer-go-build
            localton-ton-indexer-go-mod
            localton-ton-indexer-pip
          key: localton-ton-indexer-build-cache-v1-${{ matrix.arch }}-${{ hashFiles('apps/localton/Dockerfile', 'apps/localton/Cargo.lock', 'apps/localton/xtask/Cargo.toml', 'apps/localton/xtask/src/**/*.rs', 'apps/localton/docker/ton-indexer-*.patch') }}
          restore-keys: |
            localton-ton-indexer-build-cache-v1-${{ matrix.arch }}-

      - name: Inject compiler caches into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "localton-cache-mount": {
                "target": "/tmp/http-api-build/tools/ton-http-api-v2/ccache",
                "id": "ton-http-api-v2-ccache"
              },
              "localton-cargo-registry-cache": {
                "target": "/usr/local/cargo/registry",
                "id": "localton-cargo-registry"
              },
              "localton-cargo-target-cache": {
                "target": "/src/target",
                "id": "localton-cargo-target"
              },
              "localton-ton-indexer-ccache": {
                "target": "/ccache",
                "id": "ton-indexer-ccache"
              },
              "localton-ton-indexer-go-build": {
                "target": "/root/.cache/go-build",
                "id": "ton-indexer-go-build"
              },
              "localton-ton-indexer-go-mod": {
                "target": "/go/pkg/mod",
                "id": "ton-indexer-go-mod"
              },
              "localton-ton-indexer-pip": {
                "target": "/root/.cache/pip",
                "id": "ton-indexer-pip"
              }
            }
          skip-extraction: ${{ steps.http-api-cache.outputs.cache-hit == 'true' && steps.rust-cache.outputs.cache-hit == 'true' && steps.ton-indexer-cache.outputs.cache-hit == 'true' }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/ton-blockchain/localton

      - name: Build and push ${{ matrix.arch }} image by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/localton/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/ton-blockchain/localton,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            HTTP_API_BUILD_JOBS=30
            SOURCE_URL=https://github.com/${{ github.repository }}
            TON_INDEXER_BUILD_JOBS=30
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=localton-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=localton-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Export image digest
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch package
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    needs:
      - build

    permissions:
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          cache-binary: false

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/ton-blockchain/localton
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Create and push multi-arch manifest
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
          IMAGE_NAME: ghcr.io/ton-blockchain/localton
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
        shell: bash
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "${METADATA_JSON}")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "${tag}")
          done

          image_refs=()
          for digest_file in "${DIGEST_DIR}"/*; do
            image_refs+=("${IMAGE_NAME}@sha256:${digest_file##*/}")
          done

          test "${#image_refs[@]}" -eq 2
          docker buildx imagetools create "${tag_args[@]}" "${image_refs[@]}"

      - name: Inspect published package
        env:
          IMAGE_NAME: ghcr.io/ton-blockchain/localton
          VERSION: ${{ steps.metadata.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"
