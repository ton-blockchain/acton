name: Check rston

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/check-rston.yml"
      - ".github/workflows/publish-rston.yml"
      - "libs/rston/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-rston.yml"
      - ".github/workflows/publish-rston.yml"
      - "libs/rston/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: check-rston-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  check:
    name: Check rston
    runs-on: ubicloud-standard-2-ubuntu-2204
    permissions:
      contents: read
    defaults:
      run:
        working-directory: libs/rston
    steps:
      - name: Check out Acton repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: libs-rston-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: libs/rston -> target

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test library
        run: cargo test --workspace --all-features --locked

      - name: Check library
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check minimal features
        run: cargo check --lib --no-default-features --locked

      - name: Check individual features without defaults
        run: |
          for feature in base64 serde models sync wallet bigint rand8 rand9 rayon arbitrary tl adnl liteclient; do
            cargo check -p rston --lib --no-default-features --features "$feature" --locked
          done

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Verify release packages
        run: cargo publish -p rston-proc -p rston --dry-run --locked

      - name: Test release archives
        run: |
          rston_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rston"))')
          rston_package_dir="$(pwd)/target/package"
          cargo test --manifest-path "$rston_package_dir/rston-$rston_version/Cargo.toml" --all-features --offline \
            --config "patch.crates-io.rston-proc.path=\"$rston_package_dir/rston-proc-$rston_version\""

  msrv:
    name: Check rston MSRV
    runs-on: ubicloud-standard-2-ubuntu-2204
    permissions:
      contents: read
    defaults:
      run:
        working-directory: libs/rston
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Check minimal features on Rust 1.88
        run: cargo +1.88.0 check -p rston --lib --no-default-features --locked
      - name: Check all features on Rust 1.88
        run: cargo +1.88.0 check -p rston --lib --all-features --locked
