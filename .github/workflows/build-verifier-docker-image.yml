name: Build verifier Docker image

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-verifier-docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  build-verifier-docker-image:
    name: Build verifier Docker image
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          cache-binary: false

      - name: Build verifier Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: apps/verifier/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ton-verifier:ci
          cache-from: type=gha,scope=verifier
          cache-to: type=gha,mode=max,scope=verifier
