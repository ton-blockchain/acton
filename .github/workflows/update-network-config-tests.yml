name: Update Network Config Tests

on:
  schedule:
    # 08:00 Europe/Moscow every Monday (05:00 UTC)
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: update-network-config-tests
  cancel-in-progress: false

permissions: { }

jobs:
  update:
    name: Update network config test manifests
    if: github.repository == 'ton-blockchain/acton'
    runs-on: ubicloud-standard-2-ubuntu-2204
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Update network config test manifests
        working-directory: packages/explorer-core
        run: bun run network-config:fix

      - name: Check for changes
        id: changes
        # language=Bash
        run: |
          if git diff --quiet -- packages/explorer-core/scripts/config-fields; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate network configs and Explorer
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/explorer-core
        run: |
          bun run network-config:check
          bun test tests/networkConfigAudit.test.ts
          bun run build

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-network-config-tests
        # language=Bash
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create "${UPDATE_BRANCH}"
          git add packages/explorer-core/scripts/config-fields
          git commit --message "chore(explorer): update network config manifests"

          remote_sha=$(git ls-remote --heads origin "${UPDATE_BRANCH}" | awk '{print $1}')
          if [[ -n "${remote_sha}" ]]; then
            git push origin "HEAD:refs/heads/${UPDATE_BRANCH}" \
              --force-with-lease="refs/heads/${UPDATE_BRANCH}:${remote_sha}"
          else
            git push --set-upstream origin "${UPDATE_BRANCH}"
          fi

          body_file="${RUNNER_TEMP}/network-config-pr.md"
          cat > "${body_file}" <<EOF
          Updates the append-only Explorer manifests from the latest TON mainnet and testnet configurations returned by Toncenter.

          Validation: the live network configuration checks, manifest audit tests and TypeScript checks passed in the [update workflow](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          EOF

          pull_request=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${UPDATE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [[ -z "${pull_request}" ]]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base master \
              --head "${UPDATE_BRANCH}" \
              --title "chore(ci): automate network config test updates" \
              --body-file "${body_file}"
          else
            gh pr edit "${pull_request}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "chore(ci): automate network config test updates" \
              --body-file "${body_file}"
          fi
