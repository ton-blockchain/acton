name: Update Address Registry

on:
  schedule:
    # 08:00 Europe/Moscow every Monday (05:00 UTC)
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: update-address-registry
  cancel-in-progress: false

permissions: { }

jobs:
  update:
    name: Update address registry
    if: github.repository == 'ton-blockchain/acton'
    runs-on: ubicloud-standard-2-ubuntu-2204
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Update address registry
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        working-directory: packages/address-registry
        run: |
          : "${TONCENTER_API_KEY:?Toncenter API key is required}"
          bun run generate

      - name: Check for changes
        id: changes
        # language=Bash
        run: |
          if git diff --quiet -- packages/address-registry; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate address registry
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/address-registry
        run: bun run test

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-address-registry
        # language=Bash
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create "${UPDATE_BRANCH}"
          git add packages/address-registry
          git commit --message "chore(address-registry): update generated registries"

          remote_sha=$(git ls-remote --heads origin "${UPDATE_BRANCH}" | awk '{print $1}')
          if [[ -n "${remote_sha}" ]]; then
            git push origin "HEAD:refs/heads/${UPDATE_BRANCH}" \
              --force-with-lease="refs/heads/${UPDATE_BRANCH}:${remote_sha}"
          else
            git push --set-upstream origin "${UPDATE_BRANCH}"
          fi

          body_file="${RUNNER_TEMP}/address-registry-pr.md"
          cat > "${body_file}" <<EOF
          Updates the generated address and token registries from their upstream community-maintained sources.

          Validation: address registry tests and TypeScript checks passed in the [update workflow](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          EOF

          pull_request=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${UPDATE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [[ -z "${pull_request}" ]]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base master \
              --head "${UPDATE_BRANCH}" \
              --title "chore(address-registry): update generated registries" \
              --body-file "${body_file}"
          else
            gh pr edit "${pull_request}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "chore(address-registry): update generated registries" \
              --body-file "${body_file}"
          fi
