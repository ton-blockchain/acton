name: Build tree-sitter grammars

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/build-grammars.yml"
      - "crates/tree-sitter-**/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-grammars.yml"
      - "crates/tree-sitter-**/**"

concurrency:
  group: grammars-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  tree-sitter-grammars:
    name: Test tree-sitter-${{ matrix.language }} grammar
    runs-on: ubicloud-standard-4-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        language:
          - fift
          - func
          - tasm
          - tlb
          - tolk
    if: true

    permissions:
      contents: read

    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Install dependencies
        working-directory: crates/tree-sitter-${{ matrix.language }}
        run: |
          npm ci
          npm rebuild tree-sitter-cli --ignore-scripts=false

      - name: Build
        working-directory: crates/tree-sitter-${{ matrix.language }}
        run: npx tree-sitter generate

      - name: Test parsers
        working-directory: crates/tree-sitter-${{ matrix.language }}
        run: npx tree-sitter test
