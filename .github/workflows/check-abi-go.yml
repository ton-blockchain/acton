name: Check Go ABI module

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/check-abi-go.yml"
      - "packages/abi-go/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-abi-go.yml"
      - "packages/abi-go/**"
  workflow_dispatch:

concurrency:
  group: check-abi-go-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  test:
    name: Test Go ABI runtime and generator
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2-ubuntu-2204
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/abi-go
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
    steps:
      - name: Check out Acton repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: packages/abi-go/go.mod
          cache-dependency-path: packages/abi-go/go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
