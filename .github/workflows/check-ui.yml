name: Check UI

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/check-ui.yml"
      - "biome.jsonc"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "packages/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-ui.yml"
      - "biome.jsonc"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "packages/**"
  workflow_dispatch:

concurrency:
  group: check-ui-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  check:
    name: Check UI
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-16-ubuntu-2204

    permissions:
      contents: read

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: just@1.58.0
          fallback: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Restore Bun cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &linux-check-ui-bun-cache-path |
            ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-check-ui-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-check-ui-

      - name: Install UI dependencies
        run: bun ci

      - name: Run UI checks
        run: just check-ui-ci

      - name: Save Bun cache
        if: github.ref == 'refs/heads/master' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *linux-check-ui-bun-cache-path
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

  unit:
    name: Test UI units
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Restore Bun cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-test-ui-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-test-ui-

      - name: Install dependencies
        run: bun ci

      - name: Run UI unit tests
        run: bun run test:unit

      - name: Save Bun cache
        if: github.ref == 'refs/heads/master' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
