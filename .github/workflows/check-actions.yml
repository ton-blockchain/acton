name: Check Zizmor

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/**"
  push:
    branches:
      - master
    paths:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: check-zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  zizmor:
    name: Check Zizmor
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read
      security-events: write # upload SARIF report

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          min-severity: 'high'
          persona: 'auditor'

  actions-lock:
    name: Check Actions Lock
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify workflow dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify --fail-on-warning
