name: Check Actonscan backend

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/check-actonscan-backend.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/actonscan-backend/**"
      - "crates/ton-indexer-core/**"
      - "crates/ton-indexer-liteserver/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-actonscan-backend.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/actonscan-backend/**"
      - "crates/ton-indexer-core/**"
      - "crates/ton-indexer-liteserver/**"
  workflow_dispatch:

concurrency:
  group: check-actonscan-backend-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  build:
    name: Build Actonscan backend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/actonscan-backend

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: apps-actonscan-backend-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: apps/actonscan-backend -> target

      - name: Install Rust
        run: rustup toolchain install

      - name: Install just
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: just@1.58.0
          fallback: none

      - name: Build Actonscan backend
        run: just build-ci

  check:
    name: Check Actonscan backend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/actonscan-backend

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: apps-actonscan-backend-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: apps/actonscan-backend -> target

      - name: Install Rust
        run: rustup toolchain install

      - name: Install check tools
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: just@1.58.0,cargo-shear@1.13.4,cargo-deny@0.20.2
          fallback: none

      - name: Test Actonscan backend
        run: just test

      - name: Check Actonscan backend
        run: just check-ci
