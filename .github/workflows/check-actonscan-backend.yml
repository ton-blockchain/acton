name: Check Actonscan backend

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/check-actonscan-backend.yml"
      - "libs/rston/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/actonscan-backend/**"
      - "crates/ton-fullnode-master/**"
      - "crates/service-pool/**"
      - "crates/ton-p2p/**"
      - "crates/ton-indexer-p2p/**"
      - "crates/ton-indexer-core/**"
      - "crates/ton-indexer-liteserver/**"
      - "crates/ton-indexer-p2p/**"
      - "crates/ton-liteapi/**"
      - "crates/ton-p2p/**"
      - "crates/tvm-ffi/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-actonscan-backend.yml"
      - "libs/rston/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/actonscan-backend/**"
      - "crates/ton-fullnode-master/**"
      - "crates/service-pool/**"
      - "crates/ton-p2p/**"
      - "crates/ton-indexer-p2p/**"
      - "crates/ton-indexer-core/**"
      - "crates/ton-indexer-liteserver/**"
      - "crates/ton-indexer-p2p/**"
      - "crates/ton-liteapi/**"
      - "crates/ton-p2p/**"
      - "crates/tvm-ffi/**"
  workflow_dispatch:

concurrency:
  group: check-actonscan-backend-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  build:
    name: Build Actonscan backend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/actonscan-backend

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: apps-actonscan-backend-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: apps/actonscan-backend -> target

      - name: Install Rust
        run: rustup toolchain install

      - name: Install just
        uses: taiki-e/install-action@v2.87.7
        with:
          tool: just@1.58.0
          fallback: none

      - name: Build Actonscan backend
        run: just build-ci

  check:
    name: Check Actonscan backend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/actonscan-backend

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: apps-actonscan-backend-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: apps/actonscan-backend -> target

      - name: Install Rust
        run: rustup toolchain install

      - name: Install check tools
        uses: taiki-e/install-action@v2.87.7
        with:
          tool: just@1.58.0,cargo-shear@1.13.4,cargo-deny@0.20.2
          fallback: none

      - name: Test Actonscan backend
        run: just test

      - name: Check Actonscan backend
        run: just check-ci
