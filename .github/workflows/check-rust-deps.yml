name: Check Rust Dependencies

on:
  workflow_call:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/check-rust-deps.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - "!apps/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-rust-deps.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - "!apps/**"
  workflow_dispatch:

concurrency:
  group: check-deps-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  rust-audit:
    name: Rust audit
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    steps:
      - name: Check out Acton repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: just@1.58.0,cargo-deny@0.20.2,cargo-audit@0.22.2
          fallback: none

      - name: Run cargo-deny
        run: just check-deny

      - name: Run cargo-audit
        run: just check-audit
