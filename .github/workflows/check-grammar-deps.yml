name: Check Grammar Dependencies

on:
  workflow_call:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/check-grammar-deps.yml"
      - "crates/tree-sitter-**/.npmrc"
      - "crates/tree-sitter-**/package-lock.json"
      - "crates/tree-sitter-**/package.json"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-grammar-deps.yml"
      - "crates/tree-sitter-**/.npmrc"
      - "crates/tree-sitter-**/package-lock.json"
      - "crates/tree-sitter-**/package.json"
  workflow_dispatch:

concurrency:
  group: check-grammar-deps-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  npm-audit:
    name: NPM audit
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    steps:
      - name: Fetch Sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Installing additional Rust components
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: just@1.58.0
          fallback: none

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x

      - name: Run npm audit
        run: just check-grammar-security
