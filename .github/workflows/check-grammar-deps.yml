name: Check Grammar Dependencies

on:
  workflow_call:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/check-grammar-deps.yml"
      - "crates/tree-sitter-**/.npmrc"
      - "crates/tree-sitter-**/package-lock.json"
      - "crates/tree-sitter-**/package.json"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/check-grammar-deps.yml"
      - "crates/tree-sitter-**/.npmrc"
      - "crates/tree-sitter-**/package-lock.json"
      - "crates/tree-sitter-**/package.json"
  workflow_dispatch:

concurrency:
  group: check-grammar-deps-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  npm-audit:
    name: NPM audit
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Installing additional Rust components
        uses: taiki-e/install-action@v2.87.7
        with:
          tool: just@1.58.0
          fallback: none

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.x

      - name: Run npm audit
        run: just check-grammar-security
