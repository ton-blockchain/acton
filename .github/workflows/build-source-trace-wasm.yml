name: Build Source Trace WASM

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/build-source-trace-wasm.yml"
      - "libs/rston/**"
      - "crates/acton-source-trace/**"
      - "crates/acton-source-trace-wasm/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-source-trace-wasm.yml"
      - "libs/rston/**"
      - "crates/acton-source-trace/**"
      - "crates/acton-source-trace-wasm/**"
  workflow_dispatch:

concurrency:
  group: build-source-trace-wasm-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  build:
    name: Build Source Trace WASM
    runs-on: ubicloud-standard-2-ubuntu-2204

    permissions:
      contents: read

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Installing additional Rust components
        uses: taiki-e/install-action@v2.87.7
        with:
          tool: just@1.58.0,wasm-pack@0.15.0
          fallback: none

      - name: Run WASM
        run: just build-source-trace-wasm
